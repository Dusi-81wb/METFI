services:
  # ============================================================================
  # Database Service (PostgreSQL 16)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: metfi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-metfi_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metfi_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-metfi_reconciliation}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metfi_admin} -d ${POSTGRES_DB:-metfi_reconciliation}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - metfi-network

  # ============================================================================
  # Backend Service (FastAPI)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: metfi-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-metfi_admin}:${POSTGRES_PASSWORD:-metfi_secure_password}@postgres:5432/${POSTGRES_DB:-metfi_reconciliation}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BACKEND_CORS_ORIGINS: '["http://localhost:3000", "http://127.0.0.1:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - metfi-network

  # ============================================================================
  # Frontend Service (Next.js 14)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: metfi-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - metfi-network

volumes:
  postgres_data:
    driver: local

networks:
  metfi-network:
    driver: bridge
